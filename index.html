<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#0b141a">

    <!-- Primary SEO Meta Tags -->
    <title>Mofie — Pure, Fast, Convenient</title>
    <meta name="description" content="Mofie is a fast, private messaging app with disappearing messages, status updates, and crystal-clear end-to-end encryption.">
    <meta name="author" content="Herman">

    <!-- Open Graph / Social Media -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://herm-5g.github.io/mofie/">
    <meta property="og:title" content="Mofie — Pure, Fast, Convenient">
    <meta property="og:description" content="Mofie is a fast, private messaging app with disappearing messages, status updates, and crystal-clear end-to-end encryption.">
    <meta property="og:image" content="https://herm-5g.github.io/mofie/logo.jpg">
    <meta property="og:image:width" content="1080">
    <meta property="og:image:height" content="1080">
    <meta property="og:site_name" content="Mofie">

    <!-- Twitter Meta Tags -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Mofie — Pure, Fast, Convenient">
    <meta name="twitter:description" content="Mofie is a fast, private messaging app with disappearing messages, status updates, and crystal-clear end-to-end encryption.">
    <meta name="twitter:image" content="https://herm-5g.github.io/mofie/logo.jpg">

    <!-- Favicons & Manifest -->
    <link rel="icon" type="image/jpeg" href="/mofie/icon.jpg">
    <link rel="apple-touch-icon" href="/mofie/logo.jpg">
    <link rel="manifest" href="/mofie/manifest.json">

    <!-- Performance: Preconnect -->
    <link rel="preconnect" href="https://www.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://firestore.googleapis.com" crossorigin>
    <link rel="preconnect" href="https://identitytoolkit.googleapis.com" crossorigin>
    <link rel="dns-prefetch" href="https://firebaseinstallations.googleapis.com">

    <!-- 
      LIGHTNING FAST: Preload the critical JS and Splash Image 
      fetchpriority="high" tells the browser "Download this before anything else"
    -->
    <link rel="preload" href="/mofie/logo.jpg" as="image" fetchpriority="high">
    <link rel="modulepreload" href="app.js" fetchpriority="high">
    <link rel="modulepreload" href="data-saver-patch.js">
    <link rel="modulepreload" href="patches.js">

    <!-- Prevents theme flashing (FOUC) -->
    <script>
        const savedTheme = localStorage.getItem('mofie-theme') || 'dark';
        document.documentElement.setAttribute('data-theme', savedTheme);
        const defaultAccent = localStorage.getItem('mofie-accent-1') || '#00A884';
        document.documentElement.style.setProperty('--user-accent-1', defaultAccent);
    </script>

    <!-- CSS FILES -->
    <link rel="stylesheet" href="style.css" fetchpriority="high">
    <link rel="stylesheet" href="premium.css">
    <link rel="stylesheet" href="elegant.css">
    <link rel="stylesheet" href="world.css">
    <link rel="stylesheet" href="pure-theme.css">

    <!-- Inline Splash Screen Styles -->
    <style>
        #splash-screen {
            position: fixed; inset: 0;
            background-color: #000000; 
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            z-index: 999999;
            transition: opacity 0.2s ease; /* Fades out faster now */
        }
        #splash-screen.hide-splash { 
            opacity: 0; 
            pointer-events: none; 
        }
        .splash-logo {
            width: 140px;
            height: auto;
            object-fit: contain;
            /* Prevent layout shift while image loads */
            aspect-ratio: 1 / 1; 
        }
    </style>
</head>
<body>
    <!-- Custom Logo Splash Screen -->
    <div id="splash-screen" aria-hidden="true">
        <!-- Note: Make sure this image is compressed! See instructions below. -->
        <img src="/mofie/logo.jpg" alt="Mofie Logo" class="splash-logo" fetchpriority="high">
    </div>

    <!-- MAIN APP CONTAINER -->
    <div id="app"></div>

    <!-- App Scripts -->
    <script type="module" src="app.js"></script>
    <script type="module" src="data-saver-patch.js"></script>
    <script type="module" src="patches.js"></script>

    <!-- Splash Screen Removal Logic -->
    <script>
        (function () {
            const appDiv = document.getElementById('app');
            const splash = document.getElementById('splash-screen');
            if (!appDiv || !splash) return;

            const hide = () => {
                splash.classList.add('hide-splash');
                setTimeout(() => splash.remove(), 200); // Removes from DOM faster
            };

            if (appDiv.children.length > 0) { hide(); return; }

            const obs = new MutationObserver(() => {
                if (appDiv.children.length > 0) {
                    obs.disconnect();
                    hide();
                }
            });
            obs.observe(appDiv, { childList: true });

            // Failsafe: Reduced to 4 seconds for a snappier feel
            setTimeout(() => {
                obs.disconnect();
                if (document.body.contains(splash)) hide();
            }, 4000);
        })();

        // LIGHTNING FAST: Register Service Worker for Instant Repeat Visits
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/mofie/sw.js')
                    .then(reg => console.log('Service Worker Registered! App will now load instantly next time.'))
                    .catch(err => console.log('Service Worker failed: ', err));
            });
        }
    </script>
</body>
</html>
