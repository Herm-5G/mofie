name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 18

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Install dependencies
      run: |
        npm install
        npx cap add android
        npx cap sync

    - name: Clean up backend and hidden files
      run: |
        # Remove unnecessary folders so the Android app doesn't crash or get bloated
        rm -rf android/app/src/main/assets/public/functions
        rm -rf android/app/src/main/assets/public/.github
        rm -rf android/app/src/main/assets/public/.git
        rm -rf android/app/src/main/assets/public/node_modules

    - name: Add Contact Permission
      run: |
        # Automatically inject the READ_CONTACTS permission into the Android Manifest
        sed -i '/<application/i \    <uses-permission android:name="android.permission.READ_CONTACTS" />' android/app/src/main/AndroidManifest.xml

    - name: Build APK
      run: |
        cd android
        chmod +x gradlew
        ./gradlew assembleDebug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: Mofie-APK
        path: android/app/build/outputs/apk/debug/app-debug.apk
