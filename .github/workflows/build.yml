name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 18

    # Java 17 is required for Capacitor 5
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v4

    - name: Create www folder and copy web files
      run: |
        mkdir -p www
        cp index.html *.js *.css manifest.json *.jpg *.png *.xml *.txt *.html www/ 2>/dev/null || true

    - name: Install dependencies and add Android platform
      run: |
        npm install --legacy-peer-deps
        # Pinning Capacitor 5 to ensure compatibility with Java 17
        # ✅ FIXED: Added @5 to @capacitor/contacts
        npm install --legacy-peer-deps \
          @capacitor/android@5 \
          @capacitor/contacts@5 \
          @capacitor/camera@5 \
          @capacitor/push-notifications@5 \
          @capacitor/splash-screen@5 \
          @capacitor/assets
        npx cap add android
        npx cap sync

    - name: Clean old Android native icons
      run: |
        # This forces Android to delete the default robot icons
        rm -rf android/app/src/main/res/mipmap-*
        rm -rf android/app/src/main/res/drawable*/splash*

    - name: Generate App Icons & Splash
      run: |
        mkdir -p assets
        cp icon.png assets/icon.png
        cp icon.png assets/splash.png
        cp icon.png assets/splash-dark.png
        
        # Using #0B141A instead of transparent to prevent the black box square
        npx @capacitor/assets generate --android \
          --iconBackgroundColor '#0B141A' \
          --iconBackgroundColorDark '#0B141A' \
          --splashBackgroundColor '#0B141A'

    - name: Verify Splash Screen Resources
      run: |
        echo "Checking for splash resources..."
        find android/app/src/main/res -name "splash*"
        if [ -z "$(find android/app/src/main/res -name 'splash*')" ]; then
          echo "❌ ERROR: Splash screen resources were NOT generated!"
          exit 1
        else
          echo "✅ Splash screen resources found!"
        fi

    - name: Create google-services.json for Push Notifications
      env:
        GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
      run: |
        if [ -z "$GOOGLE_SERVICES_JSON_BASE64" ]; then
          echo "⚠️ WARNING: GOOGLE_SERVICES_JSON_BASE64 secret is not set. Push notifications may fail."
        else
          echo "$GOOGLE_SERVICES_JSON_BASE64" | tr -d '[:space:]' | base64 -d > android/app/google-services.json
          echo "✅ google-services.json created successfully:"
          ls -la android/app/google-services.json
        fi

    - name: Clean up unnecessary files from APK
      run: |
        rm -rf android/app/src/main/assets/public/functions
        rm -rf android/app/src/main/assets/public/.github
        rm -rf android/app/src/main/assets/public/.git

    # --- Injects Contacts, Camera, and Mic Permissions ---
    - name: Add Required Permissions to AndroidManifest
      run: |
        # Inject permissions right before the <application> tag
        sed -i 's/<application/    <uses-permission android:name="android.permission.READ_CONTACTS" \/>\n    <uses-permission android:name="android.permission.WRITE_CONTACTS" \/>\n    <uses-permission android:name="android.permission.CAMERA" \/>\n    <uses-permission android:name="android.permission.RECORD_AUDIO" \/>\n    <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" \/>\n\n    <application/' android/app/src/main/AndroidManifest.xml
        
        # Verify the permissions were added successfully in the logs
        echo "Verifying permissions in AndroidManifest:"
        grep "uses-permission" android/app/src/main/AndroidManifest.xml

    - name: Build APK
      run: |
        cd android
        chmod +x gradlew
        ./gradlew clean
        ./gradlew assembleDebug --stacktrace

    - name: Rename APK to Mofie
      run: |
        mv android/app/build/outputs/apk/debug/app-debug.apk android/app/build/outputs/apk/debug/Mofie.apk

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: Mofie-APK
        path: android/app/build/outputs/apk/debug/Mofie.apk
