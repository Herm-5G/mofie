name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20 # Upgraded to current LTS for stability

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Create www folder and copy web files
      run: |
        mkdir -p www
        # Safely copy web assets, ignoring errors if some glob patterns don't match
        cp -r *.html *.js *.css *.json *.jpg *.png *.xml *.txt www/ 2>/dev/null || true

    - name: Install NPM Dependencies
      run: |
        # Uses package.json exclusively to prevent version conflicts
        npm install --legacy-peer-deps 

    - name: Add Android Platform and Sync
      run: |
        # If the android folder doesn't exist, add it. Then always sync.
        if [ ! -d "android" ]; then
          npx cap add android
        fi
        npx cap sync android

    - name: Clean old Android native icons
      run: |
        rm -rf android/app/src/main/res/mipmap-*
        rm -rf android/app/src/main/res/drawable*/splash*

    - name: Generate App Icons & Splash
      run: |
        mkdir -p assets
        cp icon.png assets/icon.png
        cp icon.png assets/splash.png
        cp icon.png assets/splash-dark.png
        
        npx @capacitor/assets generate --android \
          --iconBackgroundColor '#0B141A' \
          --iconBackgroundColorDark '#0B141A' \
          --splashBackgroundColor '#0B141A'

    - name: Verify Splash Screen Resources
      run: |
        echo "Checking for splash resources..."
        if [ -z "$(find android/app/src/main/res -name 'splash*')" ]; then
          echo "❌ ERROR: Splash screen resources were NOT generated!"
          exit 1
        else
          echo "✅ Splash screen resources found!"
        fi

    - name: Create google-services.json for Push Notifications
      env:
        GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
      run: |
        if [ -z "$GOOGLE_SERVICES_JSON_BASE64" ]; then
          echo "⚠️ WARNING: GOOGLE_SERVICES_JSON_BASE64 secret is not set. Push notifications may fail."
        else
          echo "$GOOGLE_SERVICES_JSON_BASE64" | tr -d '[:space:]' | base64 -d > android/app/google-services.json
          echo "✅ google-services.json created successfully."
        fi

    - name: Clean up unnecessary files
      run: |
        rm -rf android/app/src/main/assets/public/functions
        rm -rf android/app/src/main/assets/public/.github
        rm -rf android/app/src/main/assets/public/.git

    - name: Add Required Permissions to AndroidManifest
      run: |
        # Safer injection: adds permissions just before the closing </manifest> tag
        sed -i 's|</manifest>|<uses-permission android:name="android.permission.READ_CONTACTS" />\n    <uses-permission android:name="android.permission.WRITE_CONTACTS" />\n    <uses-permission android:name="android.permission.CAMERA" />\n    <uses-permission android:name="android.permission.RECORD_AUDIO" />\n    <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />\n</manifest>|' android/app/src/main/AndroidManifest.xml
        
        echo "Verifying permissions:"
        grep "uses-permission" android/app/src/main/AndroidManifest.xml

    - name: Build APK
      run: |
        cd android
        chmod +x gradlew
        ./gradlew clean
        ./gradlew assembleDebug --stacktrace

    - name: Rename APK
      run: |
        mv android/app/build/outputs/apk/debug/app-debug.apk android/app/build/outputs/apk/debug/Mofie.apk

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Mofie-APK
        path: android/app/build/outputs/apk/debug/Mofie.apk
