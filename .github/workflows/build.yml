name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 18

    # 🟢 STEP UPDATED: Use JDK 21 to satisfy Capacitor's requirements
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v4

    - name: Create www folder and copy ALL web files
      run: |
        mkdir -p www
        cp index.html *.js *.css manifest.json *.jpg *.png *.xml *.txt *.html www/ 2>/dev/null || true

    - name: Install dependencies and add Android platform
      run: |
        npm install --legacy-peer-deps
        npm install --legacy-peer-deps @capacitor/android @capacitor-community/contacts @capacitor/push-notifications @capacitor/splash-screen
        npx cap add android
        npx cap sync

    - name: Generate Transparent App Icons & Splash
      run: |
        mkdir -p assets
        cp icon.png assets/icon.png
        cp icon.png assets/splash.png
        cp icon.png assets/splash-dark.png
        npx @capacitor/assets generate --android --iconBackgroundColor '#00000000' --iconBackgroundColorDark '#00000000' --splashBackgroundColor '#0B141A'

    - name: Verify Splash Screen Resources
      run: |
        echo "Checking for splash resources..."
        find android/app/src/main/res -name "splash*"
        if [ -z "$(find android/app/src/main/res -name 'splash*')" ]; then
          echo "❌ ERROR: Splash screen resources were NOT generated!"
          exit 1
        else
          echo "✅ Splash screen resources found!"
        fi

    - name: Create google-services.json for Push Notifications
      env:
        GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
      run: |
        echo "$GOOGLE_SERVICES_JSON_BASE64" | tr -d '[:space:]' | base64 -d > android/app/google-services.json
        echo "✅ google-services.json created successfully:"
        ls -la android/app/google-services.json

    - name: Clean up unnecessary files from APK
      run: |
        rm -rf android/app/src/main/assets/public/functions
        rm -rf android/app/src/main/assets/public/.github
        rm -rf android/app/src/main/assets/public/.git
        rm -rf android/app/src/main/assets/public/node_modules

    - name: Add Contact Permissions (READ and WRITE)
      run: |
        sed -i '/<application/i \    <uses-permission android:name="android.permission.READ_CONTACTS" />' android/app/src/main/AndroidManifest.xml
        sed -i '/<application/i \    <uses-permission android:name="android.permission.WRITE_CONTACTS" />' android/app/src/main/AndroidManifest.xml

    - name: Build APK
      run: |
        cd android
        chmod +x gradlew
        ./gradlew clean
        ./gradlew assembleDebug --stacktrace

    - name: Rename APK to Mofie
      run: |
        mv android/app/build/outputs/apk/debug/app-debug.apk android/app/build/outputs/apk/debug/Mofie.apk

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: Mofie-APK
        path: android/app/build/outputs/apk/debug/Mofie.apk
