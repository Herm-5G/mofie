name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v4

    - name: Create www folder and copy web files
      run: |
        mkdir -p www
        cp -r *.html *.js *.css *.json *.jpg *.png *.xml *.txt www/ 2>/dev/null || true

    - name: Install NPM Dependencies
      run: npm install --legacy-peer-deps 

    - name: Add Android Platform and Sync
      run: |
        if [ ! -d "android" ]; then
          npx cap add android
        fi
        npx cap sync android

    # 🔥 1. Inject Native Java & Manifest Files
    - name: Overlay Custom Native Files
      run: |
        cp -r native-overrides/. android/app/src/main/
        echo "Injected Native Files:"
        ls -la android/app/src/main/java/com/mofie/app/

    # 🔥 2. Add Firebase SDK Dependencies (THIS WAS MISSING)
    - name: Add Firebase dependencies to build.gradle
      run: |
        # Insert Firebase dependencies right after the "dependencies {" line
        sed -i "/dependencies {/a \    implementation platform('com.google.firebase:firebase-bom:32.7.0')\n    implementation 'com.google.firebase:firebase-messaging'" android/app/build.gradle
        echo "Added Firebase to app/build.gradle:"
        grep -A 2 "dependencies {" android/app/build.gradle

    - name: Patch Gradle for Firebase plugin
      run: |
        python3 <<'PY'
        import pathlib
        root = pathlib.Path("android/build.gradle")
        s = root.read_text()
        if "com.google.gms:google-services" not in s:
            s = s.replace("classpath 'com.android.tools.build:gradle", "classpath 'com.google.gms:google-services:4.4.2'\n        classpath 'com.android.tools.build:gradle", 1)
            root.write_text(s)
        app = pathlib.Path("android/app/build.gradle")
        s = app.read_text()
        if "com.google.gms.google-services" not in s:
            s = s.replace("apply plugin: 'com.android.application'", "apply plugin: 'com.android.application'\napply plugin: 'com.google.gms.google-services'", 1)
            app.write_text(s)
        PY

    - name: Create google-services.json for Push Notifications
      env:
        GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
      run: |
        if [ -z "$GOOGLE_SERVICES_JSON_BASE64" ]; then
          echo "⚠️ WARNING: GOOGLE_SERVICES_JSON_BASE64 secret is not set."
        else
          echo "$GOOGLE_SERVICES_JSON_BASE64" | tr -d '[:space:]' | base64 -d > android/app/google-services.json
          echo "✅ google-services.json created successfully."
        fi

    - name: Clean old Android native icons
      run: |
        rm -rf android/app/src/main/res/mipmap-*
        rm -rf android/app/src/main/res/drawable*/splash*

    - name: Generate App Icons & Splash
      run: |
        mkdir -p assets
        cp icon.png assets/icon.png
        cp icon.png assets/splash.png
        cp icon.png assets/splash-dark.png
        npx @capacitor/assets generate --android --iconBackgroundColor '#0B141A' --iconBackgroundColorDark '#0B141A' --splashBackgroundColor '#0B141A'

    - name: Verify Splash Screen Resources
      run: |
        if [ -z "$(find android/app/src/main/res -name 'splash*')" ]; then
          echo "❌ ERROR: Splash screen resources were NOT generated!"; exit 1;
        else echo "✅ Splash screen resources found!"; fi

    - name: Build APK
      run: |
        cd android
        chmod +x gradlew
        ./gradlew clean
        ./gradlew assembleDebug --stacktrace

    - name: Rename APK
      run: |
        mv android/app/build/outputs/apk/debug/app-debug.apk android/app/build/outputs/apk/debug/Mofie.apk

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Mofie-APK
        path: android/app/build/outputs/apk/debug/Mofie.apk
