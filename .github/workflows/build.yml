name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v4

    - name: Create www folder and copy web files
      run: |
        mkdir -p www
        cp -r *.html *.js *.css *.json *.jpg *.png *.xml *.txt www/ 2>/dev/null || true

    - name: Install NPM Dependencies
      run: npm install --legacy-peer-deps 

    - name: Add Android Platform and Sync
      run: |
        if [ ! -d "android" ]; then
          npx cap add android
        fi
        npx cap sync android

    # 1. Generate base icons from your root icon.png
    # Make sure icon.png is in the root of your repository!
    - name: Generate Base App Icons & Splash
      run: |
        mkdir -p assets
        cp icon.png assets/icon.png
        cp icon.png assets/splash.png
        cp icon.png assets/splash-dark.png
        npx @capacitor/assets generate --android --iconBackgroundColor '#000000' --iconBackgroundColorDark '#000000' --splashBackgroundColor '#000000'

    # 2. Purge conflicting adaptive icon folders (CRITICAL FIX for generic icon)
    - name: Purge conflicting assets
      run: |
        rm -rf android/app/src/main/res/mipmap-anydpi-v26
        rm -rf android/app/src/main/res/mipmap-anydpi-v31

    # 3. Overlay your custom Native Files (styles.xml, splash_centered.xml, etc.)
    - name: Overlay Custom Native Files
      run: |
        cp -r native-overrides/. android/app/src/main/
        echo "=== VERIFYING INJECTED NATIVE FILES ==="
        echo "--- Drawable Folder ---"
        ls -la android/app/src/main/res/drawable/
        echo "--- Values Folder ---"
        ls -la android/app/src/main/res/values/
        echo "--- Mipmap-anydpi-v26 Folder ---"
        ls -la android/app/src/main/res/mipmap-anydpi-v26/

    # 4. Add Firebase AND SplashScreen Dependencies
    - name: Add Dependencies to build.gradle
      run: |
        sed -i "/dependencies {/a \    implementation platform('com.google.firebase:firebase-bom:32.7.0')\n    implementation 'com.google.firebase:firebase-messaging'\n    implementation 'androidx.core:core-splashscreen:1.0.1'" android/app/build.gradle

    - name: Patch Gradle for Firebase plugin
      run: |
        python3 <<'PY'
        import pathlib
        root = pathlib.Path("android/build.gradle")
        s = root.read_text()
        if "com.google.gms:google-services" not in s:
            s = s.replace("classpath 'com.android.tools.build:gradle", "classpath 'com.google.gms:google-services:4.4.2'\n        classpath 'com.android.tools.build:gradle", 1)
            root.write_text(s)
        app = pathlib.Path("android/app/build.gradle")
        s = app.read_text()
        if "com.google.gms.google-services" not in s:
            s = s.replace("apply plugin: 'com.android.application'", "apply plugin: 'com.android.application'\napply plugin: 'com.google.gms.google-services'", 1)
            app.write_text(s)
        PY

    - name: Create google-services.json for Push Notifications
      env:
        GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
      run: |
        if [ -z "$GOOGLE_SERVICES_JSON_BASE64" ]; then
          echo "⚠️ WARNING: GOOGLE_SERVICES_JSON_BASE64 secret is not set."
        else
          echo "$GOOGLE_SERVICES_JSON_BASE64" | tr -d '[:space:]' | base64 -d > android/app/google-services.json
          echo "✅ google-services.json created successfully."
        fi

    # 5. Build the APK
    - name: Build APK
      run: |
        cd android
        chmod +x gradlew
        ./gradlew clean
        ./gradlew assembleDebug --stacktrace

    - name: Rename APK
      run: |
        mv android/app/build/outputs/apk/debug/app-debug.apk android/app/build/outputs/apk/debug/Mofie.apk

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Mofie-APK
        path: android/app/build/outputs/apk/debug/Mofie.apk
