name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 18

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v4

    - name: Create www folder and copy ALL web files
      run: |
        mkdir -p www
        # Copies both jpg and png files now
        cp index.html *.js *.css manifest.json *.jpg *.png *.xml *.txt *.html www/ 2>/dev/null || true

    - name: Install dependencies and add Android platform
      run: |
        npm install
        npx cap add android
        # Installs Contacts AND Push Notifications
        npm install @capacitor/android @capacitor-community/contacts @capacitor/push-notifications
        npx cap sync

    - name: Create google-services.json for Push Notifications
      run: |
        echo '${{ secrets.GOOGLE_SERVICES_JSON }}' > android/app/google-services.json

    - name: Generate Transparent App Icons & Splash Screens
      run: |
        mkdir -p assets
        cp icon.png assets/icon.png
        cp icon.png assets/splash.png
        cp icon.png assets/splash-dark.png
        # The '#00000000' forces a fully transparent background for the icon
        npx @capacitor/assets generate --android --iconBackgroundColor '#00000000' --iconBackgroundColorDark '#00000000' --splashBackgroundColor '#0B141A'

    - name: Clean up unnecessary backend files from APK
      run: |
        rm -rf android/app/src/main/assets/public/functions
        rm -rf android/app/src/main/assets/public/.github
        rm -rf android/app/src/main/assets/public/.git
        rm -rf android/app/src/main/assets/public/node_modules

    - name: Add Contact Permissions (READ and WRITE)
      run: |
        sed -i '/<application/i \    <uses-permission android:name="android.permission.READ_CONTACTS" />' android/app/src/main/AndroidManifest.xml
        sed -i '/<application/i \    <uses-permission android:name="android.permission.WRITE_CONTACTS" />' android/app/src/main/AndroidManifest.xml

    - name: Build APK
      run: |
        cd android
        chmod +x gradlew
        ./gradlew assembleDebug

    - name: Rename APK to Mofie
      run: |
        mv android/app/build/outputs/apk/debug/app-debug.apk android/app/build/outputs/apk/debug/Mofie.apk

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: Mofie-APK
        path: android/app/build/outputs/apk/debug/Mofie.apk
